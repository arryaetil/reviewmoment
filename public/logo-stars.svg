<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 72" width="268" height="72" role="img" aria-label="Reviewmoment">
  <title>Reviewmoment</title>
  <!--
    Variant met vijf sterren onder het woordmerk, bewust in outline en niet
    gevuld. Vijf gevulde sterren lezen als een scoreclaim; vijf open sterren
    lezen als "reviews" in het algemeen.

    De sterren zijn klein en dun: onder ongeveer 140 pixels breed vallen ze
    dicht. Gebruik in dat geval de variant zonder sterren.
  -->
  <g transform="translate(2 8) scale(0.625)">
    <circle
      cx="32" cy="32" r="20"
      fill="none"
      stroke="#2E2A26"
      stroke-width="5"
      stroke-linecap="round"
      stroke-dasharray="106 19.7"
    />
    <circle cx="50.1" cy="23.6" r="5.5" fill="#B96B4E"/>
  </g>

  <text
    x="56" y="38"
    font-family="var(--font-heading), 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="29"
    font-weight="500"
    letter-spacing="-0.6"
    fill="#2E2A26"
  >reviewmoment</text>

  <g fill="none" stroke="#B96B4E" stroke-width="0.17" stroke-linejoin="round">
    <path transform="translate(62 55) scale(5.4)"  d="M0 -1 L0.2245 -0.309 L0.951 -0.309 L0.3634 0.1181 L0.588 0.809 L0 0.382 L-0.588 0.809 L-0.3634 0.1181 L-0.951 -0.309 L-0.2245 -0.309 Z"/>
    <path transform="translate(75 55) scale(5.4)"  d="M0 -1 L0.2245 -0.309 L0.951 -0.309 L0.3634 0.1181 L0.588 0.809 L0 0.382 L-0.588 0.809 L-0.3634 0.1181 L-0.951 -0.309 L-0.2245 -0.309 Z"/>
    <path transform="translate(88 55) scale(5.4)"  d="M0 -1 L0.2245 -0.309 L0.951 -0.309 L0.3634 0.1181 L0.588 0.809 L0 0.382 L-0.588 0.809 L-0.3634 0.1181 L-0.951 -0.309 L-0.2245 -0.309 Z"/>
    <path transform="translate(101 55) scale(5.4)" d="M0 -1 L0.2245 -0.309 L0.951 -0.309 L0.3634 0.1181 L0.588 0.809 L0 0.382 L-0.588 0.809 L-0.3634 0.1181 L-0.951 -0.309 L-0.2245 -0.309 Z"/>
    <path transform="translate(114 55) scale(5.4)" d="M0 -1 L0.2245 -0.309 L0.951 -0.309 L0.3634 0.1181 L0.588 0.809 L0 0.382 L-0.588 0.809 L-0.3634 0.1181 L-0.951 -0.309 L-0.2245 -0.309 Z"/>
  </g>
</svg>
