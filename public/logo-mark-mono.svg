<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Reviewmoment">
  <title>Reviewmoment</title>
  <!--
    Eenkleurige variant: neemt de tekstkleur van zijn omgeving over via
    currentColor. Gebruik deze op gekleurde vlakken, in e-mail en overal
    waar het klei-accent niet werkt.
  -->
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
    <circle cx="32" cy="32" r="20" stroke-dasharray="106 19.7"/>
  </g>
  <circle cx="50.1" cy="23.6" r="5.5" fill="currentColor"/>
</svg>
