<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 64" width="268" height="64" role="img" aria-label="Reviewmoment">
  <title>Reviewmoment</title>
  <!--
    Variant met één ster: de punt die de open cirkel afmaakt is een ster
    geworden. Betekent "een review", niet "een vijfsterrenreview" — het
    beeldmerk claimt dus niets over de uitkomst.
  -->
  <g transform="translate(2 12) scale(0.625)">
    <circle
      cx="32" cy="32" r="20"
      fill="none"
      stroke="#2E2A26"
      stroke-width="5"
      stroke-linecap="round"
      stroke-dasharray="104 21.7"
    />
    <path
      transform="translate(50.1 23.6) scale(7.6)"
      d="M0 -1 L0.2245 -0.309 L0.951 -0.309 L0.3634 0.1181 L0.588 0.809 L0 0.382 L-0.588 0.809 L-0.3634 0.1181 L-0.951 -0.309 L-0.2245 -0.309 Z"
      fill="#B96B4E"
      stroke="#B96B4E"
      stroke-width="0.16"
      stroke-linejoin="round"
    />
  </g>

  <text
    x="56" y="42"
    font-family="var(--font-heading), 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="29"
    font-weight="500"
    letter-spacing="-0.6"
    fill="#2E2A26"
  >reviewmoment</text>
</svg>
