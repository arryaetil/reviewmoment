    Eenkleurige versie van het hoofdlogo. Neemt de tekstkleur van zijn
    omgeving over via currentColor — gebruik deze op gekleurde vlakken,
    in de e-mailhandtekening en overal waar het klei-accent niet werkt.
  -->

